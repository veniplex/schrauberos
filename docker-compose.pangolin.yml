# SchrauberOS hinter einem vorhandenen Pangolin – ohne veröffentlichte Ports.
# Die App ist nur über den Newt-Tunnel erreichbar.
#
#   docker compose -f docker-compose.pangolin.yml up -d --build
#
# Pflicht in der `.env` neben dieser Datei (Vorlage: docker.env.example):
#   POSTGRES_PASSWORD, PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET
#
# In Pangolin: Resource (HTTP) mit Ziel  http://app:3000  auf die Site dieses Newt legen.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schrauberos
      POSTGRES_USER: schrauberos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schrauberos -d schrauberos"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Einmaliger Job: Migrationen anwenden + Rollen/Admin/Stammdaten anlegen (idempotent)
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://schrauberos:${POSTGRES_PASSWORD}@db:5432/schrauberos
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://schrauberos:${POSTGRES_PASSWORD}@db:5432/schrauberos
      TZ: ${TZ:-Europe/Berlin}
      # Pangolin terminiert HTTPS -> Sitzungs-Cookies nur über HTTPS
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # bewusst kein `ports:` – Zugriff nur über Pangolin

  newt:
    image: fosrl/newt
    restart: unless-stopped
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?Bitte PANGOLIN_ENDPOINT in .env setzen}
      NEWT_ID: ${NEWT_ID:?Bitte NEWT_ID in .env setzen}
      NEWT_SECRET: ${NEWT_SECRET:?Bitte NEWT_SECRET in .env setzen}
    depends_on:
      - app

volumes:
  db-data:
