name: Build & publish Docker image

# Push auf main veröffentlicht das Image nur als "edge" (und "sha-…"), nie als "latest". Ein Versions-Tag v1.2.3 veröffentlicht das Image ebenfalls zunächst nur als "sha-…": "latest"
# und die Versions-Tags "1.2.3" / "1.2" setzt erst der Job "release" nach der Echtprobe (Retag desselben Digests; Vorabversionen wie v1.2.3-rc1 bekommen nur ihren vollen Namen, nie "latest").
# Das Image wird vor dem Veröffentlichen gestartet (scripts/smoke-image.sh: Standard- und gehärtete Compose-Datei). Versions-Tags erzeugen zusätzlich ein Release-Paket für
# Web-Updates, gezogen aus dem getesteten Image, mit Siegel (SOS-SEAL) und signiertem Manifest (Job "release").
#
# Alle Actions sind auf einen Commit-SHA festgelegt (Kommentar = Version); Dependabot (.github/dependabot.yml) schlägt Updates vor.
#
# Versions-Tags sind gesichert: Der Job "guard" verlangt, dass der getaggte Commit auf main liegt (Vorfahre von origin/main), und der Job "release" (hält den
# Signaturschlüssel) läuft in der GitHub-Umgebung "release" – dort muss ein Pflicht-Reviewer eingetragen sein (Repository-Einstellung, siehe README). Das Image wird
# **einmal** gebaut, genau dieses Image wird gestartet (Smoke-Test) und danach unverändert gepusht; das Release-Paket ist ein Auszug (docker cp /app) desselben Images.
#
# Die Signierstrecke hat zwei Proben ohne Veröffentlichung: "Run workflow" mit "rehearsal" (nur Testschlüssel, kein Secret) und mit "check_signing_key" (Umgebung "release": prüft nur, dass
# das Secret zum öffentlichen Schlüssel passt). Der Produktionsschlüssel wird nie für eine Probe verwendet, die jeder Zweig mit Schreibrecht auslösen könnte.
#
# Browser-Tests (Playwright, Job "e2e") kosten viele Minuten: Sie laufen NICHT bei jedem Push auf main, sondern nur bei Versions-Tags (und blockieren
# dort Image und Release), bei Pull Requests und von Hand ("Run workflow"; optional "update_snapshots" für neue Baseline-Screenshots).
#
# Lighthouse-CI (Job "lighthouse", mobil: Leistung, Zugänglichkeit, Installierbarkeit) läuft zu denselben Zeiten wie die Browser-Tests, blockiert aber nichts: Die Schwellen in
# lighthouserc.json sind Platzhalter (nur Warnungen), bis die erste Messung vorliegt.
#
# Auf main läuft die Pipeline nur, wenn sich etwas ändert, das in Image oder Tests eingeht: reine Änderungen an README, CLAUDE.md, AGENTS.md,
# .claude/ und den .env-Vorlagen lösen nichts aus (sie sind nicht im Image: siehe .dockerignore). Die Compose-Dateien gehen in den Smoke-Test
# ein und lösen deshalb einen Lauf aus; die Docs unter docs/ gehören zum Image (Hilfe in der App). Versions-Tags bauen immer; "Run workflow" erzwingt einen Lauf von Hand.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CLAUDE.md
      - AGENTS.md
      - .claude/**
      - docker.env.example
      - .env.example
      - .gitignore
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - README.md
      - CLAUDE.md
      - AGENTS.md
      - .claude/**
      - docker.env.example
      - .env.example
      - .gitignore
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Baseline-Screenshots neu erzeugen (Ergebnis als Artefakt; danach in einem eigenen Commit \"snapshots\" einchecken)"
        type: boolean
        default: false
      rehearsal:
        description: "Generalprobe der Signierstrecke (Dateiliste, Siegel, Manifest) mit Testschlüsseln; veröffentlicht nichts"
        type: boolean
        default: false
      check_signing_key:
        description: "Prüfen, dass das Secret RELEASE_SIGNING_KEY zum öffentlichen Schlüssel im Code passt (Umgebung release, Freigabe nötig); veröffentlicht nichts"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Lint, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Bekannte Schwachstellen in den Laufzeit-Abhängigkeiten (ohne Entwicklungswerkzeuge). Nur hohe und kritische Funde brechen den Lauf – sonst blockierte ein
      # neu gemeldetes Hinweis niedriger Schwere jeden Hotfix; alles darunter zeigt die Ausgabe und Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - name: Schema und Migrationen stimmen überein (Drift-Check)
        run: npm run db:check
      # Versions-Tag: Baseline und Migrationen müssen eingefroren sein (npm run db:freeze) und seit dem letzten eingefrorenen Release unverändert bleiben
      - name: Migrationen eingefroren und seit dem letzten Release unverändert
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --tags --force --unshallow || git fetch --tags --force
          npm run db:release-check -- --tag "$GITHUB_REF_NAME"

  # Der C-Prüfer im Starter (docker/verify.c, docker/bootstrap.c; README „Starter-Vertrauensanker“): alle nativen Stufen (Krypto-Vektoren, Goldkorpus, Mutationen, Parser-Differential, ASAN/UBSAN, Starter-Schleife,
  # PID-Namensraum, libFuzzer-Kurzlauf, winziger Container) – ohne Browser und ohne Bau der App. Fehlt Linux/Compiler, schlägt der Job fehl (REQUIRE_NATIVE=1).
  native:
    name: Starter-Prüfer (C), native Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: clang für die libFuzzer-Ziele
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang
      # Ubuntu 24.04 beschränkt Benutzer-Namensräume per AppArmor; der PID-Namensraum-Test (unshare -rpf) braucht sie
      - name: Benutzer-Namensräume erlauben (nur für den Test)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Native Tests
        env:
          REQUIRE_NATIVE: "1"
        run: node --no-warnings docker/test/run.mjs crypto corpus mutation parser asan starter pidns fuzz l3 --fuzz-seconds 30
      # Der Starter, wie ihn das Dockerfile baut (Debian-Compiler, static-pie, Produktionsflags; nur mit Testschlüsseln), gegen den Goldkorpus – Entwicklungs-gcc und Image-gcc dürfen nicht auseinanderlaufen
      - name: Starter aus dem Dockerfile gegen den Goldkorpus
        env:
          REQUIRE_NATIVE: "1"
        run: |
          docker build --target bootstrap-test-build -t so-bootstrap-test --build-arg APP_VERSION=0.2.0-dev.abc1234 .
          cid="$(docker create so-bootstrap-test)"
          docker cp "$cid:/bootstrap" ./bootstrap-test
          docker rm "$cid" >/dev/null
          SOS_STARTER_BINARY="$PWD/bootstrap-test" node --no-warnings docker/test/run.mjs corpus

  guard:
    name: Versions-Tag liegt auf main
    # Nur für Versions-Tags: Wer Schreibrechte hat, kann einen Tag auf einen beliebigen Commit (anderer Branch, Fork-Stand) setzen. Veröffentlicht wird nur, was
    # auch auf main liegt (also durch dessen Schutzregeln/Review gegangen ist).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Der Tag-Commit ist ein Vorfahre von origin/main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Der Commit von $GITHUB_REF_NAME liegt nicht auf main – es wird nichts veröffentlicht."; exit 1; }

  e2e:
    name: Browser-Tests (Playwright)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Browser aus der offiziellen Playwright-Quelle (nur Tests, nicht im Image)
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Browser-Tests
        env:
          E2E_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && '1' || '0' }}
        run: npm run e2e
      - name: Bericht und Fehlerspuren
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Neue Baseline-Screenshots
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots
          path: e2e/snapshots/
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobil)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: App starten (frische Daten, wie in der Browser-CI)
        run: |
          node e2e/start-server.mjs > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3100/api/health >/dev/null && exit 0
            sleep 2
          done
          cat server.log
          exit 1
      - name: Lighthouse (nur Warnungen, siehe lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Bericht
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  # E-Rechnungen (XRechnung/EN 16931) gegen den KoSIT-Prüfer: Die Tests der Rechnungserstellung (F3, Dateien *.einvoice.test.ts) schreiben ihre XML-Beispiele nach EINVOICE_SAMPLES_DIR
  # (src/test/einvoice-samples.ts), scripts/validate-xrechnung.sh lädt Prüfer und Prüfregeln in festgelegter Version, prüft die Prüfsummen und lässt jedes Beispiel prüfen. Seit F3 ist ein leerer
  # Beispielordner ein Fehler (XRECHNUNG_REQUIRE_SAMPLES=1). Läuft wie e2e nicht bei jedem Push auf main (dann übersprungen); bei Versions-Tags ist er Voraussetzung für Image und Release.
  xrechnung:
    name: XRechnung (KoSIT-Prüfer)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Beispiele erzeugen (Tests *.einvoice.test.ts)
        env:
          EINVOICE_SAMPLES_DIR: ${{ runner.temp }}/xrechnung-samples
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.einvoice.test.ts)
          if [ "${#files[@]}" -eq 0 ]; then echo "Keine Tests mit XML-Beispielen (*.einvoice.test.ts) gefunden." >&2; exit 1; fi
          npx tsx --test "${files[@]}"
      - name: Prüfen (KoSIT-Prüfer, Version und Prüfsumme festgelegt)
        env:
          EINVOICE_SAMPLES_DIR: ${{ runner.temp }}/xrechnung-samples
          XRECHNUNG_REQUIRE_SAMPLES: "1"
        run: scripts/validate-xrechnung.sh "$EINVOICE_SAMPLES_DIR" "${{ runner.temp }}/kosit"
      - name: Berichte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xrechnung-reports
          path: ${{ runner.temp }}/kosit/out/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Image bauen, testen und nach ghcr.io pushen
    # Nicht bei Pull Requests; bei Tags erst, wenn die Browser-Tests grün sind (auf main sind sie übersprungen) und der Tag auf main liegt
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.native.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') && (needs.xrechnung.result == 'success' || needs.xrechnung.result == 'skipped') && (needs.guard.result == 'success' || needs.guard.result == 'skipped') }}
    needs: [check, native, guard, e2e, xrechnung]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - id: ver
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$v" = "$pkg" ] || { echo "Tag v$v passt nicht zur Version in package.json ($pkg)"; exit 1; }
          else
            v="$pkg-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Versions-Tags und "latest" setzt NICHT dieser Job, sondern der Job "release" nach der Echtprobe (Retag desselben Digests). Hier nur der Commit-Name (und edge auf main).
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=sha
      # 1) Einmal bauen und lokal laden (noch nichts veröffentlicht). Genau dieses Image wird gestartet und – unverändert – gepusht:
      #    kein zweiter Build, der vom getesteten abweichen könnte.
      - name: Image bauen (einmal, lokal)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            SOS_TAG_BUILD=${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            schrauberos:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 2) ... starten (Standard und gehärtet) ...
      - name: Smoke-Test des Images
        run: bash scripts/smoke-image.sh schrauberos:smoke
      # 2b) Der Vertrauensanker mit der echten App: dasselbe Dockerfile, Ziel runner-test (nur der Starter trägt Testschlüssel statt der echten; alle übrigen Stufen kommen aus dem Cache).
      #     Dieses Image wird nie veröffentlicht. Nur bei Versions-Tags (kostet einige Minuten).
      - name: Image mit Testschlüsseln bauen (nur Versions-Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runner-test
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          tags: schrauberos:anchor-test
          cache-from: type=gha
      - name: Smoke-Test des Vertrauensankers (Testschlüssel-Image)
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/smoke-anchor.sh schrauberos:anchor-test
      # 3) Das Release-Paket ist ein Auszug des GETESTETEN Images (/app), kein zweiter Build (Next erzeugt je Build eine andere BUILD_ID; ein zweiter Build könnte vom getesteten
      #    abweichen). Das Paket enthält damit genau die Dateien und die Dateiliste (SOS-TREE), die der Starter-Vertrauensanker beim Start prüft.
      - name: Dateiliste des Images gegen den Baum prüfen (Referenzprüfer)
        run: |
          cid="$(docker create schrauberos:smoke)"
          mkdir pkg
          docker cp "$cid:/app/." pkg
          docker rm "$cid" >/dev/null
          node scripts/verify-tree.mjs pkg
      - name: Paket aus dem getesteten Image verpacken
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release
          # Reihenfolge und Besitzer festlegen: gleiche Eingabe, gleiche Bytes
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "release/schrauberos-${{ steps.ver.outputs.version }}.tar.gz" -C pkg .
      - name: Paket als Artefakt ablegen (für den Release-Job)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: release/
          retention-days: 7
      # 4) Erst jetzt veröffentlichen: dasselbe lokale Image. Bei Versions-Tags nur unter dem Commit-Namen (sha-…), NICHT als Versions- oder latest-Tag: Die Tags 1.2.3 / 1.2 / latest
      #    setzt erst der Job "release" nach der Echtprobe (Retag desselben Digests, ohne Neubau).
      - name: Image veröffentlichen (das getestete Image, unverändert)
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"
          first="$(echo "$TAGS" | head -n1)"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$first")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.ver.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}

  release:
    name: Echtprobe, Siegel, Release und Versions-Tags des Images
    # Erst wenn das Image unter seinem Commit-Namen veröffentlicht ist. Die Umgebung "release" verlangt einen Pflicht-Reviewer (Repository-Einstellung, README): ohne Freigabe kommt der
    # Signaturschlüssel nicht in diesen Job – auch nicht, wenn jemand mit Schreibrecht einen Tag pusht. Dieser Job ist das Tor: Erst nach der Echtprobe entstehen "latest", "X.Y.Z" und "X.Y"
    # (Retag desselben Digests) und das veröffentlichte GitHub-Release. Scheitert die Echtprobe, bleibt "latest" unverändert und es gibt kein Release.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'success' && needs.guard.result == 'success' && needs.e2e.result == 'success' && needs.xrechnung.result == 'success' && needs.publish.result == 'success' }}
    needs: [check, guard, e2e, xrechnung, publish]
    runs-on: ubuntu-latest
    environment: release
    # Nie zwei Releases gleichzeitig (zwei Tags kurz nacheinander dürfen "latest" nicht in beliebiger Reihenfolge setzen); ein laufendes wird nicht abgebrochen, das nächste wartet
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Reihenfolge der Tags: "latest" und "X.Y" setzt nur der höchste Versions-Tag. Der Job "guard" prüft nur, dass der Commit auf main liegt; ein Tag auf einem alten main-Commit mit
      # passender package.json-Version würde "latest" sonst zurückdrehen. Vor allem anderen (Signatur, Veröffentlichung, Retag) – es gibt bewusst keinen Pfad für Rückportierungen.
      - name: Der Tag ist der höchste Versions-Tag
        run: |
          git fetch --tags --force --quiet
          node --no-warnings scripts/check-release-order.mjs --tag "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: |
          pkg=$(node -p "require('./package.json').version")
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$pkg" ] || { echo "Tag v$v passt nicht zur Version in package.json ($pkg)"; exit 1; }
          [ "$v" = "${{ needs.publish.outputs.version }}" ] || { echo "Version des Images weicht ab"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: release
      - name: Paket auspacken (Berechtigungen erhalten)
        run: |
          mkdir bundle
          tar -xzpf "release/schrauberos-${{ steps.ver.outputs.version }}.tar.gz" -C bundle
      # Vorabversionen (Tag mit "-", z. B. v0.2.0-rc1) sind nicht installierbar (nur x.y.z): kein Siegel, keine Signatur, keine Echtprobe.
      - name: Siegel erzeugen und signieren (Schlüssel nur in diesem Schritt)
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          node scripts/make-seal.mjs --bundle bundle --out release
          node scripts/make-release.mjs --archive "release/schrauberos-${{ steps.ver.outputs.version }}.tar.gz" --bundle bundle --out release
      # Echtprobe: das veröffentlichte Produktions-Image (per Digest) mit dem frisch signierten Paket und den echten Schlüsseln. Danach manipuliert, muss es abweisen.
      # Ohne netzwerk, ohne Umgebung, ohne Secrets im Container; der Schlüssel liegt hier nur als Schritt-Umgebung im vorigen Schritt.
      - name: Echtprobe (Produktions-Image, echte Schlüssel)
        if: ${{ !contains(github.ref_name, '-') }}
        run: bash scripts/real-trial.sh "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}" "${{ steps.ver.outputs.version }}" bundle release/SOS-SEAL
      # Das Release zuerst als Entwurf: Web-Updates sehen nur veröffentlichte Releases.
      - name: GitHub-Release als Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Web-Updates fragen "releases/latest": Vorabversionen (Tag mit "-") sind als Vorabversion markiert und nie "latest"
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
      # Erst nach bestandener Echtprobe: Versions-Tags und latest auf denselben Digest (kein Neubau)
      - name: Versions-Tags des Images setzen (Retag desselben Digests)
        run: |
          image="ghcr.io/${{ github.repository }}"
          v="${{ steps.ver.outputs.version }}"
          tags=(-t "$image:$v")
          case "$v" in
            *-*) ;; # Vorabversion: nur der volle Versionsname
            *) tags+=(-t "$image:${v%.*}" -t "$image:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$image@${{ needs.publish.outputs.digest }}"
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Generalprobe der Signierstrecke: NIE mit dem Produktionsschlüssel (jeder Zweig mit Schreibrecht kann sie per "Run workflow" auslösen). Sie läuft mit Testschlüsseln
  # (src/lib/updates/testdata/anchor/test-keys.ts) auf einem kleinen Beispielpaket: Dateiliste, Siegel, Manifest und die Prüfung des Ergebnisses. Kein Secret, keine Umgebung "release".
  rehearsal:
    name: Generalprobe der Signierstrecke (nur Testschlüssel)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/rehearse-release.mjs

  # Prüft, dass das Secret RELEASE_SIGNING_KEY zum öffentlichen Schlüssel im Code passt (signiert und prüft eine Zufallsnachricht; veröffentlicht nichts, gibt nichts aus).
  # Läuft in der Umgebung "release", also nur mit Freigabe des Pflicht-Reviewers.
  key-check:
    name: Signaturschlüssel prüfen (ohne Veröffentlichung)
    # Nur auf main: Auf einem anderen Zweig könnte jemand mit Schreibrecht scripts/check-signing-key.mjs ändern und den Schlüssel ausgeben lassen (die Umgebung "release" gibt das Secret frei).
    # Zusätzlich muss die Umgebung "release" Deployment branches auf main und v* beschränken (README, Checkliste).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_signing_key && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Schlüsselpaar-Konsistenz
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/check-signing-key.mjs
