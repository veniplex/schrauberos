# SchrauberOS – Produktivbetrieb: ein Container, ein Volume.
#
#   docker compose up -d
#   -> App unter http://<server>:3000  (Port über APP_PORT änderbar)
#
# Beim ersten Aufruf im Browser richtet man den Administrator ein. Danach laufen Backups, Wiederherstellung und Updates
# über die Weboberfläche (Verwaltung → Backups / Updates) – am Container muss nichts mehr angefasst werden.
#
# Alles, was die Anwendung speichert, liegt im Volume "app-data" (/data): Datenbank, Backups, installierte Versionen.
# Das Volume muss auf einer LOKALEN Platte liegen (kein SMB-/NFS-Share – SQLite verträgt das nicht).
#
# Das Image kommt aus der GitHub Container Registry (ghcr.io). Ist das Repo privat, einmalig am Server anmelden:
#   echo <TOKEN> | docker login ghcr.io -u <github-benutzer> --password-stdin
#   (Token: GitHub → Settings → Developer settings → Personal access tokens (classic), Recht "read:packages")
# Lokal aus dem Quellcode bauen statt zu ziehen:  docker compose up -d --build

services:
  app:
    image: ghcr.io/veniplex/schrauberos:${SCHRAUBEROS_VERSION:-latest}
    build: .
    restart: unless-stopped
    # Zeit zum sauberen Beenden (offene Datenbank-Transaktionen abschließen)
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-data:/data

volumes:
  app-data:
