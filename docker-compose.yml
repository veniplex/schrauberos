# SchrauberOS – Produktivbetrieb mit PostgreSQL.
#
#   docker compose pull
#   docker compose up -d
#   -> App unter http://<server>:3000  (Port über APP_PORT änderbar)
#
# Das Image kommt aus der GitHub Container Registry (ghcr.io), gebaut von der GitHub-Action
# (.github/workflows/docker-publish.yml). Beim Start wendet die App selbst die Datenbank-Migrationen an.
# Ist das Repo privat, einmalig am Server anmelden:
#   echo <TOKEN> | docker login ghcr.io -u <github-benutzer> --password-stdin
#   (Token: GitHub → Settings → Developer settings → Personal access tokens (classic), Recht "read:packages")
#
# Konfiguration über eine `.env`-Datei neben dieser Datei (Vorlage: docker.env.example).
# Lokal aus dem Quellcode bauen statt zu ziehen:  docker compose up -d --build
#
# Die Datenbank ist NICHT nach außen veröffentlicht – nur die App im Compose-Netz erreicht sie.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schrauberos
      POSTGRES_USER: schrauberos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schrauberos -d schrauberos"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/veniplex/schrauberos:${SCHRAUBEROS_VERSION:-latest}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://schrauberos:${POSTGRES_PASSWORD}@db:5432/schrauberos
      TZ: ${TZ:-Europe/Berlin}
      # "true", sobald die App über HTTPS erreichbar ist (Reverse Proxy/Tunnel); bei reinem HTTP "false"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Erst-Admin: wird nur angelegt, solange noch kein Benutzer existiert (Passwortwechsel beim ersten Login)
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
